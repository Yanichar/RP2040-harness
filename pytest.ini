[pytest]
# Running `pytest` at the repository root collects both suites:
#   tests/       bench tooling (analyzer, captures, measurement) + counter scenario
#   host/tests/  the rp2040_harness Python package
# This is a Windows-only project, but the config is platform-neutral.
testpaths = tests host/tests
norecursedirs = .venv firmware/build firmware/test/fake host/src *.egg-info
addopts = -ra
