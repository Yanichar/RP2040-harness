[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rp2040-harness"
version = "0.1.0"
description = "PC-side control API for the RP2040 Harness: 24 digital lines over USB raw-vendor (TinyUSB) + pyusb/libusb"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RP2040 Harness project" }]
keywords = ["rp2040", "pico", "usb", "pyusb", "libusb", "gpio", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
    "pyusb>=1.2",
    "libusb-package>=1.0.26",
]

[project.optional-dependencies]
# MCP server for the AI-agent path (TASK.md §4.2).
mcp = ["mcp>=1.0"]
test = ["pytest>=7"]

[project.scripts]
rp2040-harness = "rp2040_harness.cli:main"
rp2040-harness-mcp = "rp2040_harness.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
